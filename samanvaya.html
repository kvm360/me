<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood report generator</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--b:#e8590c;--bd:#a8410a;--bs:#fdeee6;--bl:#f6cdb8;--bg:#fff7f2;--on:#fff;--ink:#1f2d33;--mute:#6b7782}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.form-control,.form-select{border-radius:11px;border-color:#e6ddd6;padding:.62rem .85rem}
.form-control:focus,.form-select:focus{border-color:var(--b);box-shadow:0 0 0 .22rem var(--bl)}
.form-select{font-size:.93rem;padding-right:2.1rem}
.form-label{font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:.35rem}
.input-group-text{background:var(--bs);border-color:#e6ddd6;color:var(--bd);font-size:.82rem;font-weight:600}
.input-group>.form-control{border-radius:11px 0 0 11px}.input-group>.input-group-text:last-child{border-radius:0 11px 11px 0}
.btn-main{background:var(--b);color:var(--on);border:0;border-radius:12px;padding:.8rem 1.7rem;font-weight:700;box-shadow:0 6px 16px -6px var(--b)}
.btn-main:hover{background:var(--bd);color:var(--on)}
.btn-line{display:inline-block;border:1.5px solid var(--bl);background:#fff;color:var(--bd);border-radius:12px;padding:.72rem 1.15rem;font-weight:600;font-size:.92rem;cursor:pointer}
.btn-line:hover{background:var(--bs)}
.btn-ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);color:var(--on);border-radius:999px;padding:.42rem .95rem;font-size:.84rem;font-weight:600}
.btn-ghost:hover{background:rgba(255,255,255,.28)}
.btn-text{background:none;border:0;color:var(--bd);font-size:.82rem;font-weight:600;padding:.2rem .4rem;text-decoration:underline}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.hero{background:linear-gradient(150deg,var(--b),var(--bd));color:var(--on);display:flex;flex-direction:column;justify-content:center;padding:4rem;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:420px;height:420px;right:-140px;top:-120px}.hero:after{width:300px;height:300px;left:-110px;bottom:-100px}
.hero>*{position:relative;z-index:1}
.hero-logo{width:84px;height:84px;border-radius:20px;margin-bottom:1.6rem;box-shadow:0 8px 24px rgba(0,0,0,.25);background:#fff;padding:6px;object-fit:contain}
.hero h1{font-size:2.1rem;font-weight:700;line-height:1.15;margin:0 0 .6rem;max-width:20ch}
.hero p{opacity:.9;margin:0 0 2rem;font-size:1.02rem}
.hero-av{display:flex;margin-bottom:2rem}.hero-av svg{width:130px;height:130px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}.hero-av svg+svg{margin-left:-26px}
.powered{font-size:.85rem;opacity:.92}.powered strong{font-weight:700}
.loginpane{display:flex;align-items:center;justify-content:center;padding:2rem}
.logincard{width:100%;max-width:380px}
.logincard h2{font-size:1.5rem;font-weight:700;margin-bottom:.3rem}
.logincard .sub{color:var(--mute);margin-bottom:1.6rem;font-size:.92rem}
/* app shell */
.topbar{background:linear-gradient(135deg,var(--b),var(--bd));color:var(--on);padding:.75rem 0;position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(0,0,0,.14)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0;flex:1}.brand>div{min-width:0}.brand img{border-radius:10px;flex:none;background:#fff;padding:3px;object-fit:contain}
.bn{font-weight:700;font-size:1.02rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bsub{font-size:.76rem;opacity:.88}
.tools{display:flex;gap:.5rem;flex:none;position:relative;align-items:center}
.tdot{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.9);cursor:pointer;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.12);background:conic-gradient(#e11d48,#f59e0b,#84cc16,#14b8a6,#3b82f6,#8b5cf6,#e11d48)}
.was-validated .form-control:valid,.was-validated textarea.form-control:valid{border-color:#e6ddd6;background-image:none;padding-right:.85rem}
.was-validated .form-select:valid:not([multiple]):not([size]){--bs-form-select-bg-icon:none;border-color:#e6ddd6;padding-right:2.1rem;background-position:right .75rem center;background-size:16px 12px}
.was-validated .form-control:valid:focus,.was-validated .form-select:valid:focus{border-color:var(--b);box-shadow:0 0 0 .22rem var(--bl)}
.tpop{position:absolute;top:calc(100% + 12px);right:0;width:240px;background:#fff;color:var(--ink);border:1px solid var(--bl);border-radius:14px;padding:.9rem;box-shadow:0 14px 36px rgba(0,0,0,.22);z-index:30}
.tl{font-weight:700;font-size:.85rem;margin-bottom:.6rem;color:var(--bd)}
.tsws{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:.6rem}
.tsw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c9d0d8;cursor:pointer;padding:0}.tsw:hover{box-shadow:0 0 0 2px var(--b)}
.main{padding-top:1.6rem;padding-bottom:1.2rem}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:1.5rem;align-items:start}
.panel{background:#fff;border:1px solid var(--bl);border-radius:18px;box-shadow:0 8px 28px rgba(31,45,51,.06);padding:1.7rem}
.ct{font-size:1.05rem;font-weight:700;margin:0 0 1.1rem;color:var(--bd)}
.pc-top{display:flex;align-items:center;gap:1rem;margin-bottom:1.4rem}
.avatar{width:104px;height:104px;border-radius:50%;overflow:hidden;background:var(--bs);border:4px solid #fff;box-shadow:0 0 0 2px var(--bl),0 6px 16px rgba(0,0,0,.1);flex:none}
.avatar svg,.avatar img{width:100%;height:100%;display:block;object-fit:cover}
.pc-actions{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem}
.fgrp{margin-bottom:1.1rem}
.rc-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.4rem}.rc-head .ct{margin:0}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{background:var(--bs);color:var(--bd);border-radius:999px;padding:.28rem .8rem;font-size:.78rem;font-weight:600}
.chip.bad{background:#fde3e1;color:#a4231d}
.note{background:var(--bs);border-radius:12px;padding:.6rem .9rem;font-size:.83rem;color:#5b4a40;margin:.5rem 0}
.note.warn{background:#fff3cd;color:#664d03}
.rhead,.rrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) minmax(0,.85fr) minmax(0,1fr) 5rem;gap:.4rem 1rem;align-items:center}
.rhead{font-size:.75rem;font-weight:600;color:var(--mute);padding:.6rem 0;border-bottom:1px solid var(--bl)}.rhead span:nth-child(3),.rhead span:nth-child(5){text-align:center}
.rrow{grid-template-areas:"nm in rf bar fl";padding:1rem 0;border-bottom:1px solid #f1e8e1}.rrow.tight{padding:.6rem 0}
.g-nm{grid-area:nm;line-height:1.25}.g-nm b{display:block;font-size:.95rem}.g-nm span{font-size:.78rem;color:var(--mute)}
.g-in{grid-area:in}.g-rf{grid-area:rf;text-align:center}.g-bar{grid-area:bar}.g-fl{grid-area:fl;text-align:center}
.rtxt{font-size:.82rem;color:var(--mute);white-space:nowrap}
.rb{position:relative;height:8px;border-radius:99px;background:#e3e7ea}
.rz{position:absolute;top:0;bottom:0;border-radius:99px;background:#bfe3cc}
.rm{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);opacity:0;transition:left .2s}
.rm.on{opacity:1}.rm.N{background:#1f9d62}.rm.H{background:#d1342f}.rm.L{background:#2563c9}
.fl{min-width:4.4rem;font-weight:600}
.actionbar{position:sticky;bottom:12px;margin-top:1.2rem;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border:1px solid var(--bl);border-radius:16px;padding:.8rem 1rem;display:flex;justify-content:flex-end;gap:.75rem;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:10}
.saveloc{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .7rem;margin-top:1.1rem;font-size:.83rem;color:var(--mute)}
.foot{text-align:center;color:var(--mute);font-size:.8rem;padding:1.2rem 0 2rem}.foot strong{color:var(--bd)}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#1f2d33;color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:60}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:980px){.layout{grid-template-columns:1fr}.hero{padding:2.2rem 1.5rem}}
@media(max-width:760px){
 .login{grid-template-columns:1fr}.hero{align-items:center;text-align:center;padding:2rem 1.5rem 2.4rem}.hero h1{font-size:1.55rem}.hero-av svg{width:96px;height:96px}.hero-av{margin-bottom:1.2rem}.hero p{margin-bottom:1.1rem}
 .rhead{display:none}.rrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm fl" "in in" "rf bar"}.g-fl{text-align:right}.g-rf{text-align:left}.g-bar{min-width:130px}
 .panel{padding:1.2rem}.actionbar{gap:.5rem;padding:.6rem;bottom:8px}.actionbar .btn-main{flex:1;padding:.75rem 1rem}.actionbar .btn-line{padding:.7rem .9rem}.wrap{padding:0 14px}.bsub{display:none}.bn{font-size:.88rem;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.btn-ghost{padding:.38rem .75rem;font-size:.8rem}
}
</style>
</head>

  font('bold',12,ON);doc.text(d.title,W-M,17,{align:'right'});

  var hv=!!(d.photo||d.av),X1=hv?55:22,V1=hv?78:46,W1=hv?44:58,X2=hv?124:112,V2=hv?146:136,W2=hv?46:56;

  var n=d.rows.length,dn=n>8,TOP=116,RH=dn?Math.min(8.5,110/n):12,end=TOP+RH*n,bad=[];

      font('bold',9,INK);doc.text(r.code,18,by);

  doc.setDrawColor(T[0],T[1],T[2]);doc.setLineWidth(0.4);doc.line(M,end,W-M,end);

  var lg=end+(dn?5:6),sm=end+(dn?12.5:15),rl=end+(dn?19.5:24),bx=end+(dn?21.5:27),bh=dn?17:24,bl=end+(dn?27.5:33.5),st=dn?4.6:5,ML=dn?3:4;
  font('italic',7,GR);doc.text(doc.splitTextToSize(d.legend,180),M,lg);
  font('bold',bad.length&&dn?8.5:9.5,bad.length?FC.H:FC.N);
  doc.text(doc.splitTextToSize(bad.length?'Outside the reference range: '+bad.join(', '):'All results are within the reference range.',180).slice(0,2),M,sm);

  /* remarks */

  fill([255,255,255]);doc.setDrawColor(LINE[0],LINE[1],LINE[2]);doc.setLineWidth(0.3);doc.roundedRect(M,bx,180,bh,2,2,'FD');
  font('normal',9.5,INK);
  doc.splitTextToSize(d.remarks||'No remarks.',170).slice(0,ML).forEach(function(l,i){doc.text(l,M+5,bl+i*st);});

  /* disclaimer and signature */
  font('italic',7.5,GR);
  doc.text(doc.splitTextToSize('Disclaimer: This report is an aid to diagnosis and must be interpreted by a veterinarian together with the clinical findings. Results relate only to the sample tested.',118),M,268.5);
  doc.setDrawColor(GR[0],GR[1],GR[2]);doc.setLineWidth(0.3);doc.line(140,271,195,271);

  return doc;
}

<script>
(function(){
'use strict';
var P=PANELS[PANEL_ID];
var $=function(i){return document.getElementById(i);};
function each(q,f){Array.prototype.forEach.call(document.querySelectorAll(q),f);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var FB={N:['Normal','bg-success-subtle text-success-emphasis'],H:['High','bg-danger-subtle text-danger-emphasis'],
        L:['Low','bg-primary-subtle text-primary-emphasis'],'':['-','bg-light text-secondary']};
var AUTH='auth_'+HASH.slice(0,10),TOK=HASH.slice(10,26),KD='iris_d_'+HASH.slice(0,10),KF='iris_f_'+HASH.slice(0,10),PHOTO=null;

/* ---------- theme (hospital default, or a color chosen with the Theme button on this computer) ---------- */
var WH=[255,255,255],TH,KT='iris_t_'+HASH.slice(0,10),AN=(typeof ANIMAL_IMAGES==='string'?ANIMAL_IMAGES:'screen');
function rgb(c){return 'rgb('+c.join(',')+')';}
function mkTheme(h){var b=hex2rgb(h);return {b:b,d:mix(b,[0,0,0],0.28),s:mix(b,WH,0.9),l:mix(b,WH,0.76),bg:mix(b,WH,0.95),on:1.05/(lum(b)+0.05)>=3?[255,255,255]:[31,41,51]};}
function applyTheme(h){
  TH=mkTheme(h);var r=document.documentElement.style;
  r.setProperty('--b',rgb(TH.b));r.setProperty('--bd',rgb(TH.d));r.setProperty('--bs',rgb(TH.s));r.setProperty('--bl',rgb(TH.l));r.setProperty('--bg',rgb(TH.bg));r.setProperty('--on',rgb(TH.on));
}
var tv=ld(KT);applyTheme(typeof tv==='string'&&/^#[0-9a-f]{6}$/i.test(tv)?tv:THEME);

/* ---------- branding ---------- */
document.title=HOSPITAL+': '+P.page;
each('[data-hospital]',function(e){e.textContent=HOSPITAL;});
each('[data-product]',function(e){e.textContent=PRODUCT;});
each('[data-powered]',function(e){e.textContent=POWERED;});
each('img[data-logo]',function(i){i.src=LOGO;i.alt=HOSPITAL+' logo';});
function avatarSvg(key){return '<svg viewBox="0 0 100 100" role="img" aria-label="'+key+' cartoon"><circle cx="50" cy="50" r="50" fill="'+rgb(TH.s)+'"/>'+(ANIMALS[key]||ANIMALS.paw).map(shapeSvg).join('')+'</svg>';}
function heroAv(){$('heroav').innerHTML=avatarSvg('dog')+avatarSvg('cat');}
heroAv();
if(AN==='off'){$('heroav').classList.add('d-none');$('pctop').classList.add('d-none');}
if(AN!=='all')$('phbtn').classList.add('d-none');
$('sub').textContent=PRODUCT+': '+P.page;$('ptitle').textContent=P.card;
if(P.hint){$('hint').textContent=P.hint;$('hint').classList.remove('d-none');}
$('species').innerHTML=P.species.map(function(s){return '<option value="'+s[0]+'">'+s[1]+'</option>';}).join('');
$('stype').innerHTML='<option value="">Not stated</option>'+P.stypes.map(function(s){return '<option>'+s+'</option>';}).join('');
$('scond').innerHTML='<option value="">Not stated</option>'+['Acceptable','Haemolysed','Lipaemic','Icteric','Clotted'].map(function(s){return '<option>'+s+'</option>';}).join('');

/* ---------- reference ranges ---------- */
function rng(s,label){
  var o={label:label},p;
  if(s.charAt(0)==='<'){o.hi=+s.slice(1);o.ex=1;o.txt='< '+s.slice(1);}
  else if(s.charAt(0)==='c'){o.hi=+s.slice(1);o.txt='Cutoff '+s.slice(1);}
  else{p=s.split('-');o.lo=+p[0];o.hi=+p[1];o.txt=p[0]+' - '+p[1];}
  return o;
}
function cell(c){
  if(!c||c==='x')return null;
  if(c.indexOf('|')>-1)return {alts:c.split('|').map(function(a){var q=a.split(':');return rng(q[1],q[0]);})};
  return rng(c);
}
var R={};
P.species.forEach(function(s,i){R[s[0]]={};P.tests.forEach(function(t){R[s[0]][t[0]]=cell(P.R[t[0]][i]);});});
function sp(){return $('species').value;}
function spLabel(k){var r='';P.species.forEach(function(s){if(s[0]===k)r=s[1];});return r||k;}
function avail(){return P.tests.filter(function(t){return R[sp()][t[0]];});}
function rg(k){var c=R[sp()][k];if(!c)return null;if(c.alts){var s=$('t_'+k);return c.alts[s?s.selectedIndex:0];}return c;}
function flagOf(k,v){
  if(v===''||isNaN(Number(v)))return '';
  var r=rg(k),n=Number(v);if(!r)return '';
  if(r.lo!=null&&n<r.lo)return 'L';
  if(r.hi!=null&&(r.ex?n>=r.hi:n>r.hi))return 'H';
  return 'N';
}

/* ---------- storage: unsaved draft and theme (this browser only) ---------- */
function ld(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(_){return null;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(_){return false;}}
function rmk(k){try{localStorage.removeItem(k);}catch(_){}}
var toastT;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2200);}
function today(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
function dmy(iso){var p=(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso||'';}
function dm(iso){var p=(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]:iso||'';}
function dtm(v){var m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d:\d\d)/.exec(v||'');return m?m[3]+'/'+m[2]+'/'+m[1].slice(2)+' '+m[4]:'';}

/* ---------- avatar and photo ---------- */
function avatar(){
  $('avatar').innerHTML=PHOTO?'<img alt="Patient photo" src="'+PHOTO+'">':avatarSvg(sp());
  $('phbtn').textContent=PHOTO?'Change photo':'Add photo';$('phrm').classList.toggle('d-none',!PHOTO);
}
$('photo').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;var inp=this;
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var c=document.createElement('canvas');c.width=c.height=180;var x=c.getContext('2d');
    x.fillStyle=rgb(TH.s);x.fillRect(0,0,180,180);x.beginPath();x.arc(90,90,90,0,Math.PI*2);x.clip();
    var s=Math.max(180/im.width,180/im.height);x.drawImage(im,(180-im.width*s)/2,(180-im.height*s)/2,im.width*s,im.height*s);
    PHOTO=c.toDataURL('image/jpeg',0.82);avatar();inp.value='';};
    im.onerror=function(){toast('That file could not be read as a photo.');};im.src=r.result;};
  r.readAsDataURL(f);
});
$('phrm').addEventListener('click',function(){PHOTO=null;avatar();});

/* ---------- login ---------- */
function showErr(m){var e=$('lerr');e.textContent=m;e.classList.remove('d-none');}
async function sha(s){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
}
function enter(){
  $('loginView').classList.add('d-none');$('appView').classList.remove('d-none');
  window.scrollTo(0,0);
  var d=ld(KD);
  if(d&&d.sp&&(d.pet||d.owner||Object.keys(d.vals||{}).length)){apply(d);toast('Unsaved draft restored');}
  $('pet').focus();
}
function leave(){
  try{sessionStorage.removeItem(AUTH);}catch(_){}
  clearForm();
  $('appView').classList.add('d-none');$('loginView').classList.remove('d-none');
  $('lerr').classList.add('d-none');$('u').value='';$('p').value='';$('u').focus();
}
$('loginForm').addEventListener('submit',async function(e){
  e.preventDefault();
  $('lerr').classList.add('d-none');
  var u=$('u').value.trim().toLowerCase(),p=$('p').value;
  if(!u||!p){showErr('Enter your username and password.');return;}
  $('lbtn').disabled=true;
  try{
    if(!(window.crypto&&window.crypto.subtle)){throw new Error('nocrypto');}
    var h=await sha(SALT+'|'+u+':'+p);
    if(h===HASH){
      try{sessionStorage.setItem(AUTH,TOK);}catch(_){}
      $('p').value='';enter();
    }else{
      showErr('Incorrect username or password.');$('p').value='';$('p').focus();
    }
  }catch(x){
    showErr(x&&x.message==='nocrypto'?'Sign in needs https or a local file in a current browser.':'Sign in failed. Reload the page and try again.');
  }finally{$('lbtn').disabled=false;}
});
$('tg').addEventListener('click',function(){
  var show=$('p').type==='password';
  $('p').type=show?'text':'password';this.textContent=show?'Hide':'Show';
  this.setAttribute('aria-label',show?'Hide password':'Show password');
});
$('out').addEventListener('click',leave);

/* ---------- form ---------- */
function paint(){
  var list=avail(),nin=0,nout=0;
  list.forEach(function(t){
    var k=t[0],r=rg(k),v=$('v_'+k).value,f=flagOf(k,v),b=$('f_'+k),rb=$('b_'+k),z=barZone(r),zn=rb.firstChild,mk=rb.lastChild;
    $('r_'+k).textContent=r.txt;b.className='badge fl '+FB[f][1];b.textContent=FB[f][0];
    zn.style.left=z[0]+'%';zn.style.width=(z[1]-z[0])+'%';
    if(f){mk.className='rm on '+f;mk.style.left=barPos(r,Number(v))+'%';}else{mk.className='rm';}
    if(v!==''){nin++;if(f==='H'||f==='L')nout++;}
  });
  $('nin').textContent=nin+' entered';$('nout').textContent=nout+' outside range';$('nout').className='chip'+(nout?' bad':'');
  var nt=$('spnote'),m=P.notes&&P.notes[sp()];
  if(m){nt.textContent=m;nt.classList.remove('d-none');}else{nt.classList.add('d-none');}
}
function build(){
  var keep={},tim={},list=avail(),pad=list.length>10?'tight':'';
  P.tests.forEach(function(t){var e=$('v_'+t[0]),s=$('t_'+t[0]);if(e)keep[t[0]]=e.value;if(s)tim[t[0]]=s.selectedIndex;});
  $('rows').innerHTML=list.map(function(t){
    var c=R[sp()][t[0]];
    return '<div class="rrow '+pad+'"><div class="g-nm"><b>'+t[1]+'</b><span>'+t[2]+'</span></div>'+
      '<div class="g-in"><div class="input-group"><input id="v_'+t[0]+'" type="number" step="any" min="0" max="100000" inputmode="decimal" class="form-control"'+(P.all?' required':'')+' aria-label="'+t[1]+' result"><span class="input-group-text">'+t[3]+'</span></div></div>'+
      '<div class="g-rf"><div id="r_'+t[0]+'" class="rtxt"></div>'+(c.alts?'<select id="t_'+t[0]+'" class="form-select form-select-sm mt-1" aria-label="Sample timing">'+c.alts.map(function(a){return '<option>'+a.label+'</option>';}).join('')+'</select>':'')+'</div>'+
      '<div class="g-bar"><div class="rb" id="b_'+t[0]+'"><i class="rz"></i><i class="rm"></i></div></div>'+
      '<div class="g-fl"><span id="f_'+t[0]+'" class="badge fl"></span></div></div>';
  }).join('');
  list.forEach(function(t){
    var e=$('v_'+t[0]),s=$('t_'+t[0]);
    if(keep[t[0]]!==undefined)e.value=keep[t[0]];
    if(s&&tim[t[0]]!==undefined&&tim[t[0]]<s.options.length)s.selectedIndex=tim[t[0]];
  });

}
var FIELDS=['pet','owner','pid','breed','wt','sex','ageY','ageM','vet','stype','scond','scol','date','remarks'];
function collect(){
  var o={sp:sp(),vals:{},tim:{}};
  FIELDS.forEach(function(f){o[f]=$(f).value;});
  avail().forEach(function(t){var v=$('v_'+t[0]).value;if(v!=='')o.vals[t[0]]=v;var s=$('t_'+t[0]);if(s)o.tim[t[0]]=s.selectedIndex;});
  return o;
}
function apply(o){
  FIELDS.forEach(function(f){if(o[f]!==undefined)$(f).value=o[f];});
  if(Array.prototype.some.call($('species').options,function(op){return op.value===o.sp;}))$('species').value=o.sp;
  build();
  Object.keys(o.vals||{}).forEach(function(k){var e=$('v_'+k);if(e)e.value=o.vals[k];});
  Object.keys(o.tim||{}).forEach(function(k){var s=$('t_'+k);if(s&&o.tim[k]<s.options.length)s.selectedIndex=o.tim[k];});
  paint();
}
function clearForm(){
  $('rep').reset();$('rep').classList.remove('was-validated');$('gmsg').classList.add('d-none');
  PHOTO=null;$('date').value=today();rmk(KD);build();
}
function ageText(){
  var y=$('ageY').value.trim(),m=$('ageM').value.trim(),p=[];
  y=y===''?0:Number(y);m=m===''?0:Number(m);
  if(y)p.push(y+(y===1?' year':' years'));

  return p.join(' ');
}
function msg(m){var g=$('gmsg');g.textContent=m;g.classList.remove('d-none');}
function safe(s){return (s||'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,24)||'report';}

  var id=e.target.id||'';

});

  var id=e.target.id||'';
  if(id==='species')build();else if(id.indexOf('t_')===0)paint();

});

/* ---------- theme button ---------- */
var PRESETS=['#4338ca','#1e3a5f','#2563c9','#0e7c86','#0f766e','#7f1d1d','#334155','#6b21a8'];
$('tsw').innerHTML=PRESETS.map(function(c){return '<button type="button" class="tsw" data-c="'+c+'" style="background:'+c+'" aria-label="Use color '+c+'"></button>';}).join('');
$('tbtn').addEventListener('click',function(e){e.stopPropagation();$('tpop').classList.toggle('d-none');});

/* ---------- saving PDFs without a backend: a folder on this computer (for example a synced Drive or OneDrive folder) ---------- */
var FH=null;
function idb(mode,fn){return new Promise(function(res,rej){
  var o=indexedDB.open('iris',1);
  o.onupgradeneeded=function(){o.result.createObjectStore('h');};
  o.onerror=function(){rej(o.error);};
  o.onsuccess=function(){var db=o.result;
    try{var tx=db.transaction('h',mode),rq=fn(tx.objectStore('h'));
      tx.oncomplete=function(){db.close();res(rq&&rq.result);};tx.onerror=tx.onabort=function(){db.close();rej(tx.error);};}
    catch(e){db.close();rej(e);}};
});}
function getFH(){return idb('readonly',function(s){return s.get(KF);}).catch(function(){return null;});}
function setFH(h){return idb('readwrite',function(s){return h?s.put(h,KF):s.delete(KF);}).catch(function(){});}
function locUI(){
  var can=!!window.showDirectoryPicker;
  $('sloc').textContent=FH?'Saving PDFs to the folder \u201C'+FH.name+'\u201D, sorted into year and month folders.':'PDFs are saved to this browser\u2019s Downloads folder.'+(can?'':' Use Chrome or Edge on a computer to save into a folder of your choice.');
  $('sfold').classList.toggle('d-none',!can);$('sfold').textContent=FH?'Change folder':'Choose a folder';$('sfm').classList.toggle('d-none',!FH);
}
$('sfold').addEventListener('click',async function(){
  try{var h=await window.showDirectoryPicker({mode:'readwrite',id:'iris-reports'});FH=h;locUI();toast('Folder set. New PDFs will be saved there.');await setFH(h);}
  catch(e){if(!e||e.name!=='AbortError')toast('That folder could not be used.');}
});
$('sfm').addEventListener('click',async function(){FH=null;locUI();await setFH(null);});
async function wr(dir,name,blob){var f=await dir.getFileHandle(name,{create:true}),w=await f.createWritable();await w.write(blob);await w.close();}
async function saveFile(r){
  if(FH){
    try{
      var pm=await FH.queryPermission({mode:'readwrite'});
      if(pm!=='granted')pm=await FH.requestPermission({mode:'readwrite'});
      if(pm==='granted'){
        var y=await FH.getDirectoryHandle(r.iso.slice(0,4),{create:true}),m=await y.getDirectoryHandle(r.iso.slice(5,7),{create:true});
        await wr(m,r.name,r.doc.output('blob'));return 'folder';
      }
    }catch(_){}
    r.doc.save(r.name);return 'fallback';
  }
  r.doc.save(r.name);return 'download';
}

/* ---------- PDF ---------- */
function mk(){
  var f=$('rep');f.classList.add('was-validated');$('gmsg').classList.add('d-none');
  if(!f.checkValidity()){
    var bad=f.querySelector(':invalid');
    msg(bad&&(bad.id==='ageY'||bad.id==='ageM')?'Age: years 0 to 40 and months 0 to 11, whole numbers only.':bad&&bad.id==='wt'?'Weight must be a number from 0 to 2000 kg.':'Fill in the pet name, owner, date and '+(P.all?'every result':'the results')+' (numbers only).');
    if(bad)bad.focus();return null;
  }
  var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){msg('The PDF library did not load. Check the internet connection and reload the page.');return null;}
  if(/[^\u0000-\u00FF\u2018\u2019\u201C\u201D\u2013\u2014\u2026]/.test([$('pet').value,$('owner').value,$('pid').value,$('breed').value,$('vet').value,$('remarks').value].join(''))){
    msg('The PDF can print English letters only. Type the names and remarks in English.');return null;
  }
  var cur=collect(),rows=[];
  avail().forEach(function(t){
    var v=$('v_'+t[0]).value.trim();if(v==='')return;var r=rg(t[0]);
    rows.push({code:t[1],name:t[2]+(r.label?' ('+r.label.toLowerCase()+')':''),unit:t[4],val:/e/i.test(v)?String(Number(v)):v,ref:r.txt,rg:{lo:r.lo,hi:r.hi,ex:r.ex},flag:flagOf(t[0],v)});
  });
  if(!rows.length){msg('Enter at least one result.');return null;}
  var iso=$('date').value,now=new Date(),hms=[now.getHours(),now.getMinutes(),now.getSeconds()].map(function(n){return String(n).padStart(2,'0');}).join(''),spl=spLabel(sp()),br=$('breed').value.trim(),wt=$('wt').value.trim();
  var d={logo:LOGO,theme:TH,clinic:HOSPITAL,addr:ADDRESS,phone:PHONE,analyzer:ANALYZER,title:P.title,sub:P.sub,
    legend:P.leg.replace('%s',spl.toLowerCase())+(P.pdfNote&&P.pdfNote[sp()]?' '+P.pdfNote[sp()]:''),
    id:P.idp+'-'+iso.replace(/-/g,'')+'-'+hms,date:dmy(iso),
    pet:cur.pet.trim(),owner:cur.owner.trim(),pid:cur.pid.trim()||'-',species:spl+(br?' ('+br+')':''),
    agesex:[ageText(),cur.sex].filter(Boolean).join(', ')||'-',weight:wt?wt+' kg':'-',
    sample:cur.stype||'-',collected:dtm(cur.scol)||'-',quality:cur.scond||'-',vet:cur.vet.trim()||'-',
    photo:AN==='all'?PHOTO:null,av:AN==='all'?sp():'',rows:rows,remarks:cur.remarks.trim()};
  var doc;try{doc=buildPdf(J,d);}catch(x){msg('Could not create the PDF: '+(x&&x.message?x.message:'unknown error'));return null;}
  return {doc:doc,d:d,rec:cur,iso:iso,name:P.idp+'_'+safe(d.pet)+'_'+iso+'_'+hms+'.pdf'};
}
function saved(r,how){
  if(how==='folder')toast('Saved in your folder');
  else if(how==='fallback')toast('The folder could not be used, so the PDF was downloaded instead');
  else if(how==='download')toast('PDF downloaded');
}
$('rep').addEventListener('submit',function(e){
  e.preventDefault();var r=mk();if(!r)return;
  saveFile(r).then(function(how){saved(r,how);},function(x){msg('Could not save the PDF: '+(x&&x.message?x.message:'unknown error'));});
});
try{var tf=new File([''],'a.pdf',{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[tf]}))$('share').classList.remove('d-none');}catch(_){}
$('share').addEventListener('click',async function(){
  var r=mk();if(!r)return;
  try{var file=new File([r.doc.output('blob')],r.name,{type:'application/pdf'});
    await navigator.share({files:[file],title:r.d.pet+' report'});saved(r,'share');}
  catch(x){if(!x||x.name!=='AbortError')msg('Sharing is not available here. Use Download PDF instead.');}
});
