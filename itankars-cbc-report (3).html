<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itankar’s Pet Clinic: Blood report generator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--teal:#0e7c86;--teal-d:#0a5d65;--mint:#e8f4f4;--ink:#1f2d33}
body{background:var(--mint);color:var(--ink);min-height:100vh}
.btn-teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-teal:hover,.btn-teal:focus{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.bar{background:var(--teal);color:#fff}
.card{border:1px solid #cfe3e5;border-radius:.6rem}
.card-header{background:#fff;border-bottom:2px solid var(--teal);font-weight:600;color:var(--teal-d)}
.form-control:focus,.form-select:focus{border-color:var(--teal);box-shadow:0 0 0 .2rem rgba(14,124,134,.2)}
.fl{min-width:4.5rem}
.login-wrap{min-height:100vh}
.card-body{padding:2.25rem}
.form-control,.form-select{padding:.7rem .9rem}
.form-label{margin-bottom:.5rem;font-weight:500}
.card-body .mb-3{margin-bottom:1.75rem!important}
</style>
</head>
<body>

<!-- Login -->
<section id="loginView">
  <div class="login-wrap d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-sm w-100" style="max-width:400px">
      <div class="bar text-center p-5 rounded-top">
        <img data-logo alt="Dr. Itankar’s Pet Clinic logo" width="84" height="84" class="rounded-circle">
        <h1 class="h4 mt-2 mb-0">Itankar’s Pet Clinic</h1>
        <div class="small opacity-75">Staff sign in</div>
      </div>
      <div class="card-body p-4">
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="u" class="form-label">Username</label>
            <input id="u" class="form-control" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
          <div class="mb-3">
            <label for="p" class="form-label">Password</label>
            <div class="input-group">
              <input id="p" type="password" class="form-control" autocomplete="current-password" required>
              <button type="button" id="tg" class="btn btn-outline-secondary" aria-label="Show password">Show</button>
            </div>
          </div>
          <div id="lerr" class="alert alert-danger py-2 small d-none" role="alert"></div>
          <button id="lbtn" type="submit" class="btn btn-teal w-100">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</section>

<!-- App -->
<section id="appView" class="d-none">
  <nav class="bar py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <img data-logo alt="" width="40" height="40" class="rounded-circle">
        <div class="lh-sm"><div class="fw-semibold">Itankar’s Pet Clinic</div><div class="small opacity-75">Blood report generator</div></div>
      </div>
      <button id="out" type="button" class="btn btn-outline-light btn-sm">Sign out</button>
    </div>
  </nav>

  <main class="container py-5 my-lg-3">
    <form id="rep" novalidate>
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card h-100">
            <div class="card-header">Patient details</div>
            <div class="card-body">
              <div class="mb-3"><label class="form-label" for="pet">Pet name</label><input id="pet" class="form-control" maxlength="40" required></div>
              <div class="mb-3"><label class="form-label" for="owner">Owner</label><input id="owner" class="form-control" maxlength="40" required></div>
              <div class="row g-3 mb-3">
                <div class="col-6"><label class="form-label" for="species">Species</label><select id="species" class="form-select"><option value="dog">Dog</option><option value="cat">Cat</option><option value="rabbit">Rabbit</option><option value="ferret">Ferret</option><option value="guineapig">Guinea pig</option><option value="rat">Rat</option><option value="mouse">Mouse</option><option value="horse">Horse</option><option value="cattle">Cattle</option><option value="sheep">Sheep</option><option value="pig">Pig</option></select></div>
                <div class="col-6"><label class="form-label" for="sex">Sex</label><select id="sex" class="form-select"><option value="">Not stated</option><option>Male</option><option>Female</option></select></div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-6"><label class="form-label" for="age">Age</label><input id="age" class="form-control" maxlength="14" placeholder="4 years"></div>
                <div class="col-6"><label class="form-label" for="date">Date</label><input id="date" type="date" class="form-control" required></div>
              </div>
              <div><label class="form-label" for="vet">Veterinarian</label><input id="vet" class="form-control" maxlength="40" placeholder="Dr. name"></div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card h-100">
            <div class="card-header">Complete blood count results</div>
            <div class="card-body">
              <div class="row g-2 small text-secondary pb-1 border-bottom d-none d-sm-flex">
                <div class="col-sm-4">Test</div><div class="col-sm-4">Result</div><div class="col-sm-2 text-center">Reference</div><div class="col-sm-2 text-center">Flag</div>
              </div>
              <div id="spnote" class="alert alert-warning py-2 small mt-3 mb-0 d-none" role="status"></div>
              <div id="rows"></div>
              <div class="mt-3">
                <label class="form-label" for="remarks">Remarks (optional, up to 4 lines on the report)</label>
                <textarea id="remarks" class="form-control" rows="4" maxlength="260"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="gmsg" class="alert alert-warning py-2 small mt-3 mb-0 d-none" role="alert"></div>
      <div class="d-flex gap-3 justify-content-end mt-4">
        <button id="rst" type="button" class="btn btn-outline-secondary">Clear form</button>
        <button type="submit" class="btn btn-teal px-5 py-2">Download PDF report</button>
      </div>
    </form>
  </main>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/*PDF-START*/
function buildPdf(J,d){
  var doc=new J({unit:'mm',format:'a4',compress:true});
  var W=210,M=15,T=[14,124,134],INK=[31,45,51],GR=[108,117,125],SOFT=[238,247,248];
  var FC={N:[25,135,84],H:[192,57,43],L:[31,111,178]},FN={N:'Normal',H:'High',L:'Low'};
  function fit(s,w){return doc.splitTextToSize(String(s||'-'),w)[0]||'-';}
  function font(st,sz,c){doc.setFont('helvetica',st);doc.setFontSize(sz);doc.setTextColor(c[0],c[1],c[2]);}

  /* header */
  doc.setFillColor(T[0],T[1],T[2]);doc.rect(0,0,W,40,'F');
  if(d.logo){doc.addImage(d.logo,'JPEG',M,5,30,30);}
  font('bold',20,[255,255,255]);doc.text(d.clinic,52,21);
  font('normal',9.5,[220,240,242]);doc.text('Veterinary diagnostics and haematology',52,28.5);
  font('bold',12,[255,255,255]);doc.text('Complete Blood Count',W-M,17,{align:'right'});
  font('normal',9,[220,240,242]);doc.text('Report no. '+d.id,W-M,24,{align:'right'});
  doc.text('Date '+d.date,W-M,29.5,{align:'right'});

  /* patient box */
  font('bold',10.5,T);doc.text('Patient details',M,51);
  doc.setFillColor(SOFT[0],SOFT[1],SOFT[2]);doc.setDrawColor(200,224,226);doc.setLineWidth(0.3);
  doc.roundedRect(M,54,W-2*M,31,2,2,'FD');
  [['Pet name',d.pet,'Owner',d.owner],['Species',d.species,'Age and sex',d.agesex],['Date',d.date,'Veterinarian',d.vet]].forEach(function(r,i){
    var y=62.5+i*9;
    font('normal',8.5,GR);doc.text(r[0],M+5,y);doc.text(r[2],108,y);
    font('bold',10,INK);doc.text(fit(r[1],50),M+28,y);doc.text(fit(r[3],52),108+25,y);
  });

  /* results table */
  font('bold',10.5,T);doc.text('Test results',M,95);
  doc.setFillColor(T[0],T[1],T[2]);doc.rect(M,98,180,10,'F');
  font('bold',9,[255,255,255]);
  doc.text('Test',18,104.4);doc.text('Result',102,104.4,{align:'center'});doc.text('Unit',129,104.4,{align:'center'});
  doc.text('Reference',157,104.4,{align:'center'});doc.text('Flag',183.5,104.4,{align:'center'});
  var bad=[],TOP=108,RH=13,end=TOP+RH*d.rows.length;
  d.rows.forEach(function(r,i){
    var y=TOP+i*RH;
    if(i%2===0){doc.setFillColor(SOFT[0],SOFT[1],SOFT[2]);doc.rect(M,y,180,RH,'F');}
    font('bold',10.5,INK);doc.text(r.code,18,y+5.8);
    font('normal',8,GR);doc.text(r.name,18,y+10.2);
    var c=FC[r.flag];
    font('bold',12,r.flag==='N'?INK:c);doc.text(r.val,102,y+8,{align:'center'});
    font('normal',9.5,GR);doc.text(r.unit,129,y+7.9,{align:'center'});
    font('normal',10,INK);doc.text(r.lo+' - '+r.hi,157,y+7.9,{align:'center'});
    font('bold',9.5,c);doc.text(FN[r.flag],183.5,y+7.9,{align:'center'});
    if(r.flag!=='N')bad.push(r.code+' ('+FN[r.flag]+')');
  });
  doc.setDrawColor(T[0],T[1],T[2]);doc.setLineWidth(0.4);doc.line(M,end,W-M,end);

  font('italic',7.5,GR);
  doc.text(doc.splitTextToSize('Reference ranges: Zoetis VETSCAN HM5 intervals, species '+d.species+'. '+(d.species==='Mouse'?'Mouse ranges are a guideline only. ':'')+'Flags compare each result with the range; interpret with the clinical findings.',180),M,end+6);
  if(bad.length){font('bold',9.5,FC.H);doc.text(fit('Outside the reference range: '+bad.join(', '),180),M,end+15);}
  else{font('bold',9.5,FC.N);doc.text('All results are within the reference range.',M,end+15);}

  /* remarks */
  font('bold',10.5,T);doc.text('Remarks',M,end+24);
  doc.setFillColor(255,255,255);doc.setDrawColor(200,224,226);doc.setLineWidth(0.3);doc.roundedRect(M,end+27,180,24,2,2,'FD');
  font('normal',9.5,INK);
  doc.splitTextToSize(d.remarks||'No remarks.',170).slice(0,4).forEach(function(l,i){doc.text(l,M+5,end+33.5+i*5);});

  /* signature */
  doc.setDrawColor(GR[0],GR[1],GR[2]);doc.setLineWidth(0.3);doc.line(140,271,195,271);
  font('bold',9.5,INK);doc.text(fit(d.vet,55),167.5,275.5,{align:'center'});
  font('normal',8,GR);doc.text('Veterinarian',167.5,279.5,{align:'center'});

  /* footer */
  doc.setFillColor(T[0],T[1],T[2]);doc.rect(0,285,W,12,'F');
  font('normal',8,[255,255,255]);doc.text(d.clinic+' - computer-generated report',W/2,292,{align:'center'});
  return doc;
}
/*PDF-END*/
</script>

/* ---------- login ---------- */
function showErr(m){var e=$('lerr');e.textContent=m;e.classList.remove('d-none');}
async function sha(s){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
}
function enter(){
  $('loginView').classList.add('d-none');$('appView').classList.remove('d-none');
  window.scrollTo(0,0);$('pet').focus();
}
function leave(){
  try{sessionStorage.removeItem(AUTH);}catch(_){}
  $('appView').classList.add('d-none');$('loginView').classList.remove('d-none');
  $('lerr').classList.add('d-none');$('u').value='';$('p').value='';$('u').focus();
}
$('loginForm').addEventListener('submit',async function(e){
  e.preventDefault();
  $('lerr').classList.add('d-none');
  var u=$('u').value.trim().toLowerCase(),p=$('p').value;
  if(!u||!p){showErr('Enter your username and password.');return;}
  $('lbtn').disabled=true;
  try{
    if(!(window.crypto&&window.crypto.subtle)){throw new Error('nocrypto');}
    var h=await sha(SALT+'|'+u+':'+p);
    if(h===HASH){
      try{sessionStorage.setItem(AUTH,'1');}catch(_){}
      $('p').value='';enter();
    }else{
      showErr('Incorrect username or password.');$('p').value='';$('p').focus();
    }
  }catch(x){
    showErr(x&&x.message==='nocrypto'?'Sign in needs https or a local file in a current browser.':'Sign in failed. Reload the page and try again.');
  }finally{$('lbtn').disabled=false;}
});
$('tg').addEventListener('click',function(){
  var show=$('p').type==='password';
  $('p').type=show?'text':'password';this.textContent=show?'Hide':'Show';
  this.setAttribute('aria-label',show?'Hide password':'Show password');
});
$('out').addEventListener('click',leave);

/* ---------- form ---------- */
function sp(){return $('species').value;}
function flagOf(k,v){
  if(v===''||isNaN(Number(v)))return '';
  var r=R[sp()][k],n=Number(v);return n<Number(r[0])?'L':n>Number(r[1])?'H':'N';
}
function paint(){
  TESTS.forEach(function(t){
    var k=t[0],r=R[sp()][k],f=flagOf(k,$('v_'+k).value),b=$('f_'+k);
    $('r_'+k).textContent=r[0]+' - '+r[1];
    b.className='badge fl '+FB[f][1];b.textContent=FB[f][0];
  });
  var nt=$('spnote');
  if(sp()==='mouse'){nt.textContent='Zoetis lists mouse ranges as a guideline only. Mouse models vary.';nt.classList.remove('d-none');}else{nt.classList.add('d-none');}
}
function today(){
  var n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
}
function build(){
  $('rows').innerHTML=TESTS.map(function(t){
    return '<div class="row g-3 align-items-center py-4 border-bottom">'+
      '<div class="col-12 col-sm-4"><div class="fw-semibold">'+t[1]+'</div><div class="small text-secondary">'+t[2]+'</div></div>'+
      '<div class="col-6 col-sm-4"><div class="input-group"><input id="v_'+t[0]+'" type="number" step="any" min="0" inputmode="decimal" class="form-control" required aria-label="'+t[1]+' result">'+
      '<span class="input-group-text">'+t[3]+'</span></div></div>'+
      '<div id="r_'+t[0]+'" class="col-3 col-sm-2 small text-secondary text-center"></div>'+
      '<div class="col-3 col-sm-2 text-center"><span id="f_'+t[0]+'" class="badge fl"></span></div></div>';
  }).join('');
  $('date').value=today();paint();
  TESTS.forEach(function(t){$('v_'+t[0]).addEventListener('input',paint);});
}
function msg(m){var g=$('gmsg');g.textContent=m;g.classList.remove('d-none');}
function safe(s){return (s||'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,24)||'report';}
function dmy(iso){var p=iso.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}

$('species').addEventListener('change',paint);
$('rst').addEventListener('click',function(){
  $('rep').reset();$('rep').classList.remove('was-validated');$('gmsg').classList.add('d-none');
  $('date').value=today();paint();
});
$('rep').addEventListener('submit',function(e){
  e.preventDefault();
  var f=$('rep');f.classList.add('was-validated');$('gmsg').classList.add('d-none');
  if(!f.checkValidity()){
    msg('Fill in the pet name, owner, date and every result (numbers only).');
    var bad=f.querySelector(':invalid');if(bad)bad.focus();return;
  }
  var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){msg('The PDF library did not load. Check the internet connection and reload the page.');return;}
  var iso=$('date').value,now=new Date();
  var rows=TESTS.map(function(t){
    var v=$('v_'+t[0]).value.trim(),r=R[sp()][t[0]];
    return {code:t[1],name:t[2],unit:t[4],val:v,lo:r[0],hi:r[1],flag:flagOf(t[0],v)};
  });
  var age=$('age').value.trim(),sex=$('sex').value;
  var d={logo:LOGO,clinic:CLINIC,pet:$('pet').value.trim(),owner:$('owner').value.trim(),species:$('species').options[$('species').selectedIndex].text,
    agesex:[age,sex].filter(Boolean).join(', ')||'-',date:dmy(iso),vet:$('vet').value.trim()||'-',
    id:'CBC-'+iso.replace(/-/g,'')+'-'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0'),
    rows:rows,remarks:$('remarks').value.trim()};
  try{buildPdf(J,d).save('CBC_'+safe(d.pet)+'_'+iso+'.pdf');}
  catch(x){msg('Could not create the PDF: '+(x&&x.message?x.message:'unknown error'));}
});

/* ---------- start ---------- */
build();
var ok=false;try{ok=sessionStorage.getItem(AUTH)==='1';}catch(_){}
if(ok){enter();}else{$('u').focus();}
})();
</script>
</body>
</html>
