<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>പോയി പഠിക്ക് KURIPPE 📖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Baloo+Bhai+2:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ea;
    --line:#c9d3ea;
    --margin:#e8a7a2;
    --ink:#243154;
    --ink-soft:#4b5578;
    --coral:#e8604c;
    --highlight:#f6d94c;
    --tape:#f2b6a3;
    --sage:#7fa876;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(var(--paper) 0 38px, var(--line) 38px 39px),
      var(--paper);
    background-position: 0 6px;
    position:relative;
    font-family:"Inter", -apple-system, "Segoe UI", sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 3rem 1.2rem;
  }
  body::before{
    content:"";
    position:fixed;
    top:0; bottom:0; left: 46px;
    width:2px;
    background: var(--margin);
    opacity:.55;
  }
  @media (max-width:560px){ body::before{ left:26px; } }

  .sheet{
    position:relative;
    max-width: 640px;
    width:100%;
    text-align:center;
    padding: 1rem 1.4rem 2.4rem;
  }

  .tape{
    position:absolute;
    background: var(--tape);
    opacity:.85;
    box-shadow: 0 2px 4px rgba(0,0,0,.08);
  }
  .tape.t1{ width:110px; height:34px; top:-18px; left:-10px; transform:rotate(-8deg); }
  .tape.t2{ width:90px; height:30px; top:-14px; right:-6px; transform:rotate(7deg); }

  .stamp{
    display:inline-block;
    font-family:"Baloo Bhai 2", sans-serif;
    font-weight:700;
    font-size:.78rem;
    letter-spacing:.03em;
    color:#fff;
    background: var(--coral);
    padding:.3rem .8rem;
    border-radius: 4px;
    transform: rotate(-3deg);
    margin-bottom: 1.6rem;
    box-shadow: 2px 2px 0 rgba(36,49,84,.15);
  }

  .headline{
    font-family:"Baloo Bhai 2", sans-serif;
    font-weight:700;
    font-size: clamp(1.7rem, 6vw, 2.7rem);
    line-height:1.25;
    color: var(--ink);
    margin: 0 0 .3rem;
  }
  .headline .hl{
    background: linear-gradient(transparent 62%, var(--highlight) 62%);
    padding: 0 .1rem;
  }

  .translit{
    font-family:"Caveat", cursive;
    font-weight:700;
    font-size: clamp(1.35rem, 4vw, 1.8rem);
    color: var(--coral);
    transform: rotate(-1.2deg);
    margin: .2rem 0 1.7rem;
  }

  .doodle{ width: 190px; margin: 0 auto 1.6rem; display:block; }

  .excuses{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:.6rem;
    margin: 0 0 1.9rem;
    padding:0;
    list-style:none;
  }
  .excuses li{
    font-family:"Baloo Bhai 2", sans-serif;
    font-size:.85rem;
    color: var(--ink-soft);
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:.4rem .7rem;
    box-shadow: 1px 2px 0 rgba(36,49,84,.06);
    text-decoration: line-through;
    text-decoration-color: var(--coral);
    text-decoration-thickness: 2px;
    transform: rotate(var(--r,-1deg));
  }
  .excuses li:nth-child(2){ --r: 1.5deg; }
  .excuses li:nth-child(3){ --r: -2deg; }
  .excuses li:nth-child(4){ --r: 1deg; }

  .cta{
    font-family:"Baloo Bhai 2", sans-serif;
    font-weight:700;
    font-size:1.05rem;
    color:#fff;
    background: var(--sage);
    border:none;
    border-radius: 10px;
    padding: .9rem 1.9rem;
    cursor:pointer;
    box-shadow: 0 4px 0 #5f8657;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .cta:active{
    transform: translateY(4px);
    box-shadow: 0 0 0 #5f8657;
  }

  .followup{
    font-family:"Caveat", cursive;
    font-size:1.35rem;
    color: var(--ink-soft);
    min-height: 1.6em;
    margin-top: 1rem;
  }

  .footer-note{
    font-size:.75rem;
    color: var(--ink-soft);
    opacity:.65;
    margin-top: 2.2rem;
  }

  .confetti{
    position:fixed;
    top:-2rem;
    font-size:1.4rem;
    pointer-events:none;
    animation: fall linear forwards;
    z-index: 5;
  }
  @keyframes fall{
    to{ transform: translateY(105vh) rotate(360deg); opacity:.9; }
  }

  @media (prefers-reduced-motion: reduce){
    .confetti{ animation: none; display:none; }
  }
</style>
</head>
<body>

  <div class="sheet">
    <div class="tape t1"></div>
    <div class="tape t2"></div>

    <span class="stamp">⚠ EXAM ALERT</span>

    <h1 class="headline">
      "പോയി പഠിക്ക് <b>KURIPPEEEE</b>,<br>
      <span class="hl">ചുമ്മാ വെബ്സൈറ്റ് നോക്കി ഇരിക്കാതെ!</span>"
    </h1>
    <p class="translit">— "poyi padik kurippeee, chumma website nokki irikkathe" —</p>

    <svg class="doodle" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="148" rx="70" ry="8" fill="#243154" opacity="0.08"/>
      <rect x="55" y="95" width="90" height="55" rx="6" stroke="#243154" stroke-width="3"/>
      <rect x="63" y="103" width="74" height="39" rx="3" fill="#f6d94c" opacity="0.35"/>
      <circle cx="100" cy="55" r="24" stroke="#243154" stroke-width="3"/>
      <circle cx="92" cy="52" r="2.4" fill="#243154"/>
      <circle cx="108" cy="52" r="2.4" fill="#243154"/>
      <path d="M90 63 Q100 58 110 63" stroke="#243154" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M100 79 L100 95" stroke="#243154" stroke-width="3"/>
      <path d="M100 88 L75 100" stroke="#243154" stroke-width="3" stroke-linecap="round"/>
      <path d="M100 88 L125 100" stroke="#243154" stroke-width="3" stroke-linecap="round"/>
      <text x="128" y="35" font-family="Caveat, cursive" font-size="22" fill="#e8604c" transform="rotate(-8 128 35)">???</text>
    </svg>

    <ul class="excuses">
      <li>5 more mins scroll</li>
      <li>notifications check cheyyam</li>
      <li>onnu WhatsApp nokkiyittu</li>
      <li>naale nokkaam</li>
    </ul>

    <button class="cta" id="studyBtn">ശരി ശരി, പോയി പഠിക്കാം 📚</button>
    <div class="followup" id="followupText"></div>

    <p class="footer-note">made 2 minutes before someone's exam, probably.</p>
  </div>

<script>
  const messages = [
    "ആ ഒരു ഉറപ്പ് മതി 👍 — ഇനി ബുക്ക് തുറക്ക്!",
    "ok fr fr, notes edukku 📖",
    "chumma promise alle... enthayalum, all the best 🌸",
    "MCQ portal open cheyyu, ith allengil ath 😄",
    "recheck of Rasashastra topics, GO GO GO 🏃"
  ];
  const btn = document.getElementById("studyBtn");
  const followup = document.getElementById("followupText");
  let idx = 0;

  btn.addEventListener("click", () => {
    followup.textContent = messages[idx % messages.length];
    idx++;
    burst();
  });

  function burst(){
    const emojis = ["📚","✏️","🌿","✅","☕"];
    for (let i=0;i<14;i++){
      const el = document.createElement("div");
      el.className = "confetti";
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left = Math.random()*100 + "vw";
      el.style.animationDuration = (1.6 + Math.random()*1.2) + "s";
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 3000);
    }
  }
</script>
</body>
</html>
