<!DOCTYPE html>

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{

    --bark:#1f3527;

    --parchment:#f6f1e4;

    --gold-2:#8f6a1f;

    --rust:#a8452f;
    --rust-bg:#f7e6e1;
    --muted:#6b6252;
    --line:#ddd2b3;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype",Georgia,serif;
    -webkit-font-smoothing:antialiased;
  }
  .sans{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; }

  /* ---------- Header ---------- */
  .exam-header{
    background: linear-gradient(160deg, var(--bark) 0%, var(--bark-2) 100%);
    color: var(--parchment);
    padding: 2.2rem 1.5rem 1.6rem;
    border-bottom: 4px solid var(--gold);
  }
  .exam-header .eyebrow{
    font-family: var(--sans, inherit);
    letter-spacing:.02em;
    color: #cbb98a;
    font-size:.82rem;
    margin-bottom:.35rem;
  }
  .exam-header h1{
    font-weight:600;
    font-size: clamp(1.5rem, 3vw, 2.1rem);
    margin-bottom:.15rem;
  }
  .exam-header p.sub{
    color:#d8d0b6;
    margin-bottom:0;
    font-size:.98rem;
  }
  .stat-chip{
    background: rgba(255,255,255,.08);
    border:1px solid rgba(230,215,170,.35);
    border-radius:8px;
    padding:.5rem .9rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
  }
  .stat-chip .num{ font-size:1.15rem; font-weight:700; color:#f2e9cf; line-height:1;}
  .stat-chip .lbl{ font-size:.72rem; color:#c8bd9a; text-transform:none;}

  /* ---------- Paper tabs ---------- */
  .paper-nav{
    background: var(--parchment-2);
    border-bottom:1px solid var(--line);
    padding: .6rem 1.5rem;
  }
  .paper-nav .nav-link{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    color: var(--muted);
    border:1px solid transparent;
    border-radius: 999px;
    padding:.45rem 1.1rem;
    margin-right:.5rem;
    font-size:.92rem;
    font-weight:600;
  }
  .paper-nav .nav-link .count{
    font-weight:500;
    opacity:.75;
    margin-left:.35rem;
  }
  .paper-nav .nav-link.active{
    background: var(--bark);
    color: var(--parchment);
    border-color: var(--bark);
  }
  .paper-nav .nav-link:not(.active):hover{
    background: #e4d9b8;
    color: var(--ink);
  }

  .wrap{ max-width: 860px; margin: 0 auto; padding: 1.8rem 1.25rem 5rem; }

  .paper-intro{
    margin-bottom:1.6rem;
  }
  .paper-intro h2{
    font-size:1.35rem;
    font-weight:600;
    margin-bottom:.2rem;
  }
  .paper-intro .meta{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    color: var(--muted);
    font-size:.88rem;
  }
  .note-flag{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    background: #fbf0d9;
    border:1px solid #e6cd8d;
    color:#6b5518;
    border-radius:8px;
    padding:.55rem .8rem;
    font-size:.83rem;

  /* ---------- Question card ---------- */
  .qcard{

    border:1px solid var(--line);
    border-left: 4px solid var(--line);
    border-radius:10px;
    padding:1.1rem 1.2rem 1rem;
    margin-bottom:1rem;

  }
  .qcard.is-correct{ border-left-color: var(--sage); }
  .qcard.is-wrong{ border-left-color: var(--rust); }
  .qcard.is-unanswered{ border-left-color: var(--gold); }

  .qnum{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    display:inline-flex;
    align-items:center;
    justify-content:center;

    color: var(--parchment);

    margin-right:.65rem;

  .qhead{ display:flex; align-items:flex-start; }
  .qbadge{

  .opt{

    border:1px solid var(--line);

    margin-bottom:.5rem;

    font-size:.93rem;

  .opt:hover{ background:#faf5e6; border-color:#cbb98a; }
  .opt .letter{

    width:1.4rem;
    font-weight:700;
    color:var(--gold-2);
  }
  .opt.selected{

  }
  .opt.locked{ cursor:default; }

  .opt.correct-answer{

  .opt.wrong-answer{

  }
</style>
</head>

/* ============================================================
   STATE
   ============================================================ */
const state = {};
PAPERS.forEach(p => { state[p.id] = { answers: new Array(p.questions.length).fill(null), submitted:false }; });

const LETTERS = ["a","b","c","d"];

function totalQuestions(){
  return PAPERS.reduce((s,p)=>s+p.questions.length,0);
}

function updateGlobalChips(){
  document.getElementById("chip-total").textContent = totalQuestions();
  let answered = 0;
  PAPERS.forEach(p => { answered += state[p.id].answers.filter(a=>a!==null).length; });
  document.getElementById("chip-answered").textContent = answered;
}

/* ============================================================
   RENDER
   ============================================================ */
function buildTabs(){
  const tabsEl = document.getElementById("paperTabs");
  const panelsEl = document.getElementById("paperPanels");

  PAPERS.forEach((paper, idx) => {
    const li = document.createElement("li");
    li.className = "nav-item";
    const a = document.createElement("a");
    a.href = "#";
    a.className = "nav-link" + (idx===0 ? " active" : "");
    a.dataset.paper = paper.id;
    a.innerHTML = `${paper.label} <span class="count">(${paper.questions.length})</span>`;
    a.addEventListener("click", (e)=>{
      e.preventDefault();
      document.querySelectorAll(".paper-nav .nav-link").forEach(n=>n.classList.remove("active"));
      a.classList.add("active");
      document.querySelectorAll(".paper-panel").forEach(n=>n.style.display="none");
      document.getElementById("panel-"+paper.id).style.display="block";
    });
    li.appendChild(a);
    tabsEl.appendChild(li);

    const panel = document.createElement("div");
    panel.className = "paper-panel";
    panel.id = "panel-"+paper.id;
    panel.style.display = idx===0 ? "block" : "none";
    panel.innerHTML = renderPanel(paper);
    panelsEl.appendChild(panel);
  });

  PAPERS.forEach(paper => attachHandlers(paper));
  updateGlobalChips();
}

function renderPanel(paper){
  let html = `
    <div class="paper-intro">
      <h2>${paper.label}</h2>
      <div class="meta">${paper.meta}</div>
      ${paper.note ? `<div class="note-flag">⚑ ${paper.note}</div>` : ""}
    </div>
    <div class="result-banner" id="result-${paper.id}"></div>
  `;
  paper.questions.forEach((item, qi) => {
    html += `
      <div class="qcard" id="qcard-${paper.id}-${qi}">
        <div class="qhead">
          <span class="qnum">${qi+1}</span>
          <div class="qtext">${item.q}<span class="qbadge-slot"></span></div>
        </div>
        <div class="opts" data-paper="${paper.id}" data-q="${qi}">
          ${item.opts.map((opt, oi) => `
            <button type="button" class="opt" data-oi="${oi}">
              <span class="letter">${LETTERS[oi]})</span> ${opt}
            </button>
          `).join("")}
        </div>
        <div class="answer-note d-none" id="note-${paper.id}-${qi}"></div>
      </div>
    `;
  });
  html += `
    <div class="action-bar">
      <button class="btn btn-submit" data-action="submit" data-paper="${paper.id}">Submit paper</button>
      <button class="btn btn-reset" data-action="reset" data-paper="${paper.id}">Reset</button>
    </div>
  `;
  return html;
}

function attachHandlers(paper){
  const panel = document.getElementById("panel-"+paper.id);

  panel.querySelectorAll(".opts").forEach(group => {
    const qi = parseInt(group.dataset.q, 10);
    group.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state[paper.id].submitted) return;
        const oi = parseInt(btn.dataset.oi, 10);
        state[paper.id].answers[qi] = oi;
        group.querySelectorAll(".opt").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        updateGlobalChips();
      });
    });
  });

  panel.querySelector('[data-action="submit"]').addEventListener("click", () => submitPaper(paper));
  panel.querySelector('[data-action="reset"]').addEventListener("click", () => resetPaper(paper));
}

function submitPaper(paper){
  const s = state[paper.id];
  s.submitted = true;
  let correctCount = 0;

  paper.questions.forEach((item, qi) => {
    const card = document.getElementById(`qcard-${paper.id}-${qi}`);
    const group = card.querySelector(".opts");
    const chosen = s.answers[qi];
    const isCorrect = chosen !== null && item.correct.includes(chosen);
    if (isCorrect) correctCount++;

    group.querySelectorAll(".opt").forEach((btn, oi) => {
      btn.classList.add("locked");
      btn.classList.remove("selected");
      if (item.correct.includes(oi)) {
        btn.classList.add("correct-answer");
        btn.innerHTML = btn.innerHTML + ` <span class="tick">✓</span>`;
      } else if (oi === chosen) {
        btn.classList.add("wrong-answer");
        btn.innerHTML = btn.innerHTML + ` <span class="tick">✗</span>`;
      }
    });

    card.classList.remove("is-correct","is-wrong","is-unanswered");
    const badgeSlot = card.querySelector(".qbadge-slot");
    if (chosen === null){
      card.classList.add("is-unanswered");
      badgeSlot.innerHTML = `<span class="qbadge skip">Not answered</span>`;
    } else if (isCorrect){
      card.classList.add("is-correct");
      badgeSlot.innerHTML = `<span class="qbadge right">Correct</span>`;
    } else {
      card.classList.add("is-wrong");
      badgeSlot.innerHTML = `<span class="qbadge wrong">Incorrect</span>`;
    }

    if (item.note){
      const noteEl = document.getElementById(`note-${paper.id}-${qi}`);
      noteEl.textContent = item.note;
      noteEl.classList.remove("d-none");
    }
  });

  const total = paper.questions.length;
  const pct = Math.round((correctCount/total)*100);
  let verdict;
  if (pct >= 80) verdict = "Strong pass — well prepared on this paper.";
  else if (pct >= 50) verdict = "Passing range — revisit the missed formulations before the real exam.";
  else verdict = "Below the usual pass mark — worth another close read of this paper's topics.";

  const banner = document.getElementById("result-"+paper.id);
  banner.innerHTML = `
    <div class="d-flex align-items-center gap-4 flex-wrap">
      <div>
        <div class="score-num">${correctCount} / ${total}</div>
        <div class="score-lbl">SCORE ON THIS PAPER</div>
      </div>
      <div>
        <div class="score-num" style="font-size:1.4rem;">${pct}%</div>
        <div class="score-lbl">ACCURACY</div>
      </div>
      <div class="verdict">${verdict}</div>
    </div>
  `;
  banner.classList.add("show");
  document.getElementById("chip-score").textContent = `${correctCount}/${total}`;
  updateGlobalChips();

  banner.scrollIntoView({behavior:"smooth", block:"start"});
}

function resetPaper(paper){
  const s = state[paper.id];
  s.submitted = false;
  s.answers = new Array(paper.questions.length).fill(null);

  const panel = document.getElementById("panel-"+paper.id);
  panel.querySelector("#result-"+paper.id).classList.remove("show");
  panel.querySelector("#result-"+paper.id).innerHTML = "";

  paper.questions.forEach((item, qi) => {
    const card = document.getElementById(`qcard-${paper.id}-${qi}`);
    card.classList.remove("is-correct","is-wrong","is-unanswered");
    card.querySelector(".qbadge-slot").innerHTML = "";
    const noteEl = document.getElementById(`note-${paper.id}-${qi}`);
    noteEl.classList.add("d-none");
    noteEl.textContent = "";

    const group = card.querySelector(".opts");
    group.querySelectorAll(".opt").forEach((btn, oi) => {
      btn.classList.remove("selected","locked","correct-answer","wrong-answer");
      btn.innerHTML = `<span class="letter">${LETTERS[oi]})</span> ${item.opts[oi]}`;
    });
  });

  updateGlobalChips();
}

buildTabs();
</script>
</body>
</html>
